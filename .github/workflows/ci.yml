name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [feature/**]

jobs:
  build-test:
    name: Build & Test (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B clean verify

      - name: Package Lambda jar
        run: ./mvnw -B -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-jar
          path: target/os-management-lambda.jar
          retention-days: 5

  terraform-validate:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  terraform-plan:
    name: Terraform plan (PR preview)
    runs-on: ubuntu-latest
    # Skip on forked PRs — they have no access to repo secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # Informational: a red plan (e.g. infra dependency not yet applied) must not block the PR.
    continue-on-error: true
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_environment: ${{ github.base_ref == 'main' && 'prod' || 'homolog' }}
      TF_VAR_db_user: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_origin_url: ${{ secrets.ORIGIN_URL }}
      TF_VAR_origin_verify_token: ${{ secrets.ORIGIN_VERIFY_TOKEN }}
      TF_VAR_os_management_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Build Lambda jar (needed for source_code_hash)
        working-directory: .
        run: ./mvnw -B -DskipTests package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=lambda/${TF_VAR_environment}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform plan
        run: terraform plan -no-color -input=false -var="aws_region=${{ env.AWS_REGION }}"
