name: CD

on:
  push:
    branches: [develop, main]

# develop -> homolog, main -> prod
jobs:
  deploy:
    name: Package & Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
      TF_VAR_db_url: ${{ secrets.DB_URL }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_vpc_subnet_ids: ${{ secrets.VPC_SUBNET_IDS }}
      TF_VAR_vpc_security_group_ids: ${{ secrets.VPC_SECURITY_GROUP_IDS }}
      TF_VAR_protected_backend_url: ${{ secrets.PROTECTED_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Build Lambda jar
        working-directory: .
        run: ./mvnw -B clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=lambda/${TF_VAR_environment}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform apply
        run: terraform apply -auto-approve -var="aws_region=${{ secrets.AWS_REGION }}"
