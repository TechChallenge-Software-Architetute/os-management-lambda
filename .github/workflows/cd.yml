name: CD

on:
  push:
    branches: [develop, main]

# develop and main both deploy; the branch name is the environment.
jobs:
  deploy:
    name: Package & Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: terraform
    env:
      # Environment is the branch name: develop or main.
      TF_VAR_environment: ${{ github.ref_name }}
      # Repo-scoped secrets (per GitHub Environment: develop/main).
      TF_VAR_db_user: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      # Root os-management state key: develop maps to homol and main maps to prod.
      TF_VAR_os_management_state_key: ${{ github.ref_name == 'main' && 'prod/terraform.tfstate' || 'homol/terraform.tfstate' }}
      # State buckets are stored as GitHub Secrets, selected by branch (main->MAIN, develop->DEVELOP).
      TF_STATE_BUCKET: ${{ github.ref_name == 'main' && secrets.TF_STATE_BUCKET_MAIN || secrets.TF_STATE_BUCKET_DEVELOP }}
      TF_VAR_os_management_state_bucket: ${{ github.ref_name == 'main' && secrets.TF_STATE_BUCKET_MAIN || secrets.TF_STATE_BUCKET_DEVELOP }}
      TF_VAR_aws_account_id: ${{ github.ref_name == 'main' && vars.AWS_ACCOUNT_ID_MAIN || vars.AWS_ACCOUNT_ID_DEVELOP }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Build Lambda jar
        working-directory: .
        run: ./mvnw -B clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.ref_name == 'main' && secrets.AWS_ACCESS_KEY_ID_MAIN || secrets.AWS_ACCESS_KEY_ID_DEVELOP }}
          aws-secret-access-key: ${{ github.ref_name == 'main' && secrets.AWS_SECRET_ACCESS_KEY_MAIN || secrets.AWS_SECRET_ACCESS_KEY_DEVELOP }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=lambda/${TF_VAR_environment}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform apply
        run: terraform apply -auto-approve -var="aws_region=${{ env.AWS_REGION }}"
