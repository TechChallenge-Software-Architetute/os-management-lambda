name: CD

on:
  push:
    branches: [develop, main]

# develop -> homolog, main -> prod
jobs:
  deploy:
    name: Package & Deploy (Lambda + API Gateway)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      # develop -> homolog, main -> prod
      TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
      # Secrets reused from os-management conventions (DB_USER, DB_PASSWORD, JWT_SECRET)
      TF_VAR_db_user: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      # Backend URL for the API Gateway proxy. Leave the secret unset to read it
      # from SSM (/os-management/<env>/app/origin_url) published by the app pipeline.
      TF_VAR_origin_url: ${{ secrets.ORIGIN_URL }}
      TF_VAR_origin_verify_token: ${{ secrets.ORIGIN_VERIFY_TOKEN }}
      # Shared state bucket (repo variable, same as os-management)
      TF_VAR_os_management_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Build Lambda jar
        working-directory: .
        run: ./mvnw -B clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=lambda/${TF_VAR_environment}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false -var="aws_region=${{ env.AWS_REGION }}"

      - name: Publish API URL to the job summary
        run: |
          echo "### API Gateway (${TF_VAR_environment})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform output -raw api_base_url >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
